<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#171717" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Capacity" />
		<script>
			/*
			 * Set the theme BEFORE the page renders.
			 *
			 * Doing this in a component means the browser paints a white page
			 * first and then repaints it dark — the flash that makes a dark mode
			 * feel bolted on. This is the one place a blocking inline script is
			 * the right answer.
			 */
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch {
					/* private mode, storage blocked: fall back to light */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
